name: Capture v9 responsive screenshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-v9.yml'
      - '.github/qa/capture-v9.cjs'
      - 'index.html'
      - 'assets/v9.css'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve current repository files
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 > /tmp/terrafiber_http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:8123/ > /dev/null
      - name: Capture screenshots and inspect responsive layout
        run: node .github/qa/capture-v9.cjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/terraFIBER-v9-desktop.png docs/screenshots/terraFIBER-v9-mobile.png
          git diff --cached --quiet || git commit -m "Add verified v9 desktop and 375px mobile screenshots"
          git pull --rebase origin main
          git push
